server {
    listen 18091 ssl;
    listen [::]:18091 ssl;
    server_name api.treeapi.online;

    ssl_certificate     /www/server/panel/vhost/cert/treeapi.online/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/treeapi.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/wwwlogs/onesearch-api.log;
    error_log  /www/wwwlogs/onesearch-api.error.log;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Plain HTTP listener for in-network clients (docker bridge, private ranges).
server {
    listen 18092;
    listen [::]:18092;
    server_name _;

    access_log /www/wwwlogs/onesearch-api.log;
    error_log  /www/wwwlogs/onesearch-api.error.log;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
