# One Search API 示例配置
# 复制为 config.yaml 后修改；所有时长均为 Go duration 字符串（5s / 1m / 2h）。

server:
  addr: ":8080"
  read_header_timeout: 5s
  # 单请求总预算：搜索的上游扇出(12s) + 正文抓取都在这个预算内
  request_timeout: 30s
  shutdown_timeout: 10s
  max_body_bytes: 1048576   # 1 MiB
  # 只有来自这些地址的 X-Forwarded-For 才会被采信
  trusted_proxies:
    - 127.0.0.1
    - ::1

auth:
  # none = 本机调试用（所有人可用，按 IP 限流）；key = 必须带 Bearer Key
  mode: key
  anonymous_rpm: 30
  anonymous_daily_quota: 0   # 0 = 不限
  keys:
    - name: me
      # 可直接写明文，也可写 "sha256:<hex>"（推荐）
      token: "sk-onesearch-change-me"
      rpm: 120                # 每分钟请求数
      burst: 20               # 令牌桶容量
      daily_quota: 5000       # 每天请求数，0 = 不限
      max_results: 50         # 该 Key 单次最多返回条数
      allowed_providers: []   # 空 = 允许全部 provider

    - name: friend
      token: "sk-onesearch-friend-change-me"
      rpm: 60
      burst: 10
      daily_quota: 1500
      max_results: 20
      allowed_providers: [bing, searxng]

search:
  default_count: 10
  max_count: 50
  overall_timeout: 12s        # 上游扇出总预算
  provider_timeout: 2500ms    # 单个 provider 预算（Bing 渠道建议在 providers 里单独放宽）
  max_concurrency: 32         # 全局并发请求闸门
  need_content_max_results: 10
  content_fetch_timeout: 8s
  content_fetch_concurrency: 6
  per_domain_limit: 3
  cache_ttl: 5m
  site_icon_template: "https://{host}/favicon.ico"
  # 已有足够结果后，最多再等慢 provider 多久就放弃（0 或注释掉 = 800ms）
  hedge_delay: 800ms

fetch:
  timeout: 10s
  max_bytes: 5242880          # 5 MiB
  max_redirects: 5
  allow_private: false        # 生产环境务必保持 false（SSRF 防护）
  allow_ports: [80, 443, 8080, 8443]
  user_agent: "Mozilla/5.0 (compatible; OneSearchAPI/1.0)"
  cache_ttl: 30m
  min_content_runes: 120

providers:
  # ============================ Bing 渠道 ============================
  # Bing RSS 与 HTML 是同一个搜索后端的两种渲染：同一 query 下结果集完全一致。
  #   - bingrss  ：约 5KB，自带发布时间（date 字段更完整），推荐作为默认渠道。
  #   - binghtml ：约 100KB，摘要/日期结构更全，适合需要精细解析时使用。
  #
  # 国内版：cn.bing.com + market zh-CN；国际版：www.bing.com + market en-WW。
  # 即「2 种类型 × 2 个市场 = 4 个渠道」，按需启用；同版 rss+html 同时开收益不大
  # （同一批结果会双源融合）。
  #
  # 反爬与稳定性（均自动处理，一般无需配置）：
  #   - 每次会话随机生成 Chrome 指纹（UA / sec-ch-ua / 平台），失败时自动轮换；
  #   - 首次请求前访问首页预热，拿到 MUID/_EDGE_S/SRCHD 等真实 cookie；
  #   - 带 Referer、Accept-Language、Sec-Fetch-* 与真实搜索参数（form/QBLH/cvid/sc…）；
  #   - RSS 返回空 channel（软限流）时同渠道重试 → 仍失败则回退解析 HTML；
  #   - 结果明显离题（Bing 偶发回放别的 query 缓存）时整批丢弃并重试。

  - name: bing                 # 国内版 RSS（默认渠道）
    type: bingrss
    enabled: true
    weight: 0.9
    base_url: "https://cn.bing.com"
    market: "zh-CN"
    timeout: 6s                # 预热 + 搜索 + 可能的同渠道重试
    rpm: 30
    # warmup: true             # 首页预热（默认 true）
    # mobile: false            # true = 移动端 UA + LBT003/PC/scope 参数（移动 HTML 每页仅 5 条）
    # user_agent: ""           # 留空 = 每次会话随机生成；填写则固定
    # referer: ""              # 留空 = base_url 首页
    # cookies: ""              # 手动附加 Cookie（预热已能拿到真实 cookie，一般不需要）
    # extra_params: {}         # 追加任意查询参数

  - name: bing-html            # 国内版 HTML
    type: binghtml
    enabled: false
    weight: 0.9
    base_url: "https://cn.bing.com"
    market: "zh-CN"
    timeout: 6s
    rpm: 20

  - name: bing-intl            # 国际版 RSS（部署在境外时用这个）
    type: bingrss
    enabled: false
    weight: 0.9
    base_url: "https://www.bing.com"
    market: "en-WW"
    timeout: 6s
    rpm: 30

  - name: bing-intl-html       # 国际版 HTML
    type: binghtml
    enabled: false
    weight: 0.9
    base_url: "https://www.bing.com"
    market: "en-WW"
    timeout: 6s
    rpm: 20

  # ============================ 其它渠道 ============================

  # SearXNG：需要在其 settings.yml 的 search.formats 中开启 json
  - name: searxng
    type: searxng
    enabled: true
    weight: 1.1
    base_url: "http://127.0.0.1:8888"
    token: ""                 # SearXNG 若启用 token 鉴权则填写
    rpm: 120
    timeout: 3s

  # DuckDuckGo HTML：无需 Key，但可能触发验证码；中国大陆网络通常不可达，默认关闭
  - name: ddg
    type: duckduckgo
    enabled: false
    weight: 0.8
    base_url: "https://html.duckduckgo.com"
    rpm: 20
    timeout: 3s

  # Brave Search API（免费 2000 次/月，需要自备 key）
  - name: brave
    type: brave
    enabled: false
    weight: 1.0
    api_key: ""
    region: ""                # 可选，如 US / CN
    rpm: 30

  # Tavily（免费 1000 次/月，需要自备 key）
  - name: tavily
    type: tavily
    enabled: false
    weight: 1.0
    api_key: ""
    rpm: 30

cache:
  search_max_entries: 512
  fetch_max_entries: 512
  search_ttl: 5m
  fetch_ttl: 30m
  cleanup_interval: 1m

log:
  level: info
  format: json                # json | text
