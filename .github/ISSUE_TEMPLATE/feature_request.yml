name: Feature request
description: Suggest a new backend, config option or robustness improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project stays deliberately small: self-hosted, contract-compatible, no billing.
        Please check the scope in [CONTRIBUTING.md](https://github.com/Wu-jiyan/one-search-api/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the project cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API/config shape if it changes the surface, and which module it would live in.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - New search backend
        - Contract / wire compatibility
        - Robustness (retries, anti-bot, caching, rate limiting)
        - Configuration / deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not involve captcha solving, paywall bypass, or circumventing access controls
          required: true
