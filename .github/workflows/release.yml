name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test ./...

      - name: build archives
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            name="onesearch_${ver}_${os}_${arch}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${ver}" \
              -o "dist/$name/onesearch${ext}" ./cmd/onesearch
            cp README.md README.en.md LICENSE config.example.yaml "dist/$name/"
            if [ "$os" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "$name")
            else
              (cd dist && tar -czf "${name}.tar.gz" "$name")
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum ./* > checksums.txt && ls -lh)

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "one-search-api $TAG" \
              --generate-notes \
              --notes "Docker: \`docker build -t one-search-api .\` (or \`docker compose up -d --build\` for the SearXNG setup)."
          fi
